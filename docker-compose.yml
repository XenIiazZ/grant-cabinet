services:
  minio:
    image: minio/minio:latest
    container_name: grant-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: grant-backend
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - SQLALCHEMY_DATABASE_URL=sqlite:///./grants.db
      - S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - sqlite_data:/app
    depends_on:
      minio:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: grant-frontend
    ports:
      - "8081:3000"
    depends_on:
      - backend

volumes:
  minio_data:
  sqlite_data: