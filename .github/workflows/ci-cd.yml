jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Устанавливаем тестовые пакеты (если они не в requirements.txt)
          pip install pytest pytest-asyncio pytest-cov httpx factory-boy faker aioresponses pytest-mock
      - name: Run backend tests
        run: |
          cd backend
          python -m pytest -v --cov=app

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install
      - name: Run Vitest tests
        run: |
          cd frontend
          npx vitest run